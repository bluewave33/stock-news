    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-6px); box-shadow: 0 16px 32px rgba(120,90,40,0.12); }

        .gradient-bg { background: #A8895A; }
        .gradient-bg:hover { background: #96784d; }
        .gradient-text {
            color: #7A5C30;
        }

        .badge { backdrop-filter: blur(10px); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in { animation: slideIn 0.5s ease-out forwards; }

        .glass-effect {
            background: #f5f0e8;
            backdrop-filter: blur(10px);
        }

        .gold-ring:focus {
            border-color: #A8895A !important;
            box-shadow: 0 0 0 2px rgba(168,137,90,0.18) !important;
        }

        .tag-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 500;
            transition: all 0.2s;
        }
        .tag-chip-active { background: #A8895A; color: #fff; }
        .tag-chip-inactive { background: #f7f2eb; color: #7A5C30; border: 1px solid #ddd0bc; }

        .tag-del-btn { cursor: pointer; opacity: 0.6; font-size: 14px; line-height: 1; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.55);
            display: flex; align-items: center; justify-content: center;
            z-index: 60; padding: 16px; overflow-y: auto;
        }
    </style>
</head>
<body class="bg-amber-50">
    <div id="root"></div>

                summary: "현대차그룹의 글로벌 전기차 판매량이 전년 대비 45% 증가하며 시장 점유율을 빠르게 확대하고 있습니다.",

                fullContent: `네이버가 자체 개발한 초거대 AI '하이퍼클로바X'를 기반으로 한 차세대 검색 서비스를 공개했습니다.\n\n<strong>새로운 검색 경험</strong>\n\n기존 키워드 검색을 넘어 자연어로 질문하면 AI가 여러 소스의 정보를 종합해 답변을 제공합니다.\n\n<strong>글로벌 확장</strong>\n\n일본 라인 검색 서비스에 우선 적용하고, 베트남, 태국 등 동남아시아 시장으로 확대할 계획입니다.`,

                fullContent: `카카오가 공정거래위원회의 시장지배적 지위 남용 조사 소식에 주가 급락을 경험했습니다.\n\n<strong>규제 이슈</strong>\n\n공정위는 카카오톡 메신저의 시장지배적 지위를 이용해 카카오페이, 카카오T 등 계열사 서비스를 부당하게 우대했다는 의혹을 조사 중입니다.\n\n<strong>투자자 반응</strong>\n\n일부 증권사 애널리스트들은 "규제 리스크가 이미 주가에 충분히 반영됐다"며 반등 가능성을 제시했습니다.`,
                company: "카카오", ticker: "035720", category: "규제",
                source: "이데일리", time: "3시간 전", priceChange: "-4.7%", isPositive: false,
                image: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=800",
                views: 1567, comments: 89,
                tags: ["규제", "공정위", "과징금", "리스크", "IT"]
            },
            {
                id: 5,
                title: "LG에너지솔루션, 북미 배터리 공장 증설 계획 발표",
                summary: "미국 IRA 정책 수혜를 받아 오하이오주에 3조원 규모의 신규 공장 건설을 추진합니다.",
                fullContent: `LG에너지솔루션이 미국 오하이오주에 3조원을 투자해 새로운 배터리 공장을 건설합니다.\n\n<strong>투자 배경</strong>\n\n미국 인플레이션 감축법(IRA)에 따른 세액공제 혜택을 받기 위한 전략적 투자입니다.\n\n<strong>생산 계획</strong>\n\n새 공장은 연간 40GWh 규모의 배터리를 생산할 계획이며, GM의 전기차 라인업에 공급될 예정입니다.`,
                company: "LG에너지솔루션", ticker: "373220", category: "투자",
                source: "조선일보", time: "4시간 전", priceChange: "+2.1%", isPositive: true,
                image: "https://images.unsplash.com/photo-1606787619248-2b146f5d75e0?w=800",
                views: 743, comments: 18,
                tags: ["배터리", "전기차", "투자", "공장증설", "미국"]
            },
            {
                id: 6,
                title: "SK하이닉스, HBM4 개발 완료... 2025년 상반기 양산 돌입",
                summary: "차세대 고대역폭 메모리 HBM4 개발을 완료하고 주요 AI 칩 제조사들과 공급 계약을 체결했습니다.",
                fullContent: `SK하이닉스가 차세대 고대역폭 메모리(HBM) HBM4 개발을 완료하고 양산 준비에 돌입했습니다.\n\n<strong>기술 혁신</strong>\n\nHBM4는 기존 HBM3E 대비 데이터 전송 속도가 50% 향상되고 전력 효율은 30% 개선됐습니다.\n\n<strong>고객사 확보</strong>\n\n엔비디아, AMD 등 주요 AI 칩 제조사들과 공급 계약을 체결했으며, 2025년 상반기부터 본격 양산에 들어갈 예정입니다.`,
                company: "SK하이닉스", ticker: "000660", category: "기술",
                source: "헤럴드경제", time: "5시간 전", priceChange: "+4.5%", isPositive: true,
                image: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=800",
                views: 1891, comments: 45,
                tags: ["AI", "반도체", "HBM", "메모리", "기술혁신"]
            }
        ];


        /* ───── NewsCard ───── */
        function NewsCard({ news, index, onClick }) {
            return (
                <div
                    onClick={() => onClick(news)}
                    className="card-hover bg-white rounded-2xl overflow-hidden shadow-lg animate-slide-in cursor-pointer"
                    style={{ animationDelay: `${index * 0.1}s` }}
                >
                    <div className="relative h-48 overflow-hidden">
                        <img src={news.image} alt={news.title} className="w-full h-full object-cover transition-transform duration-500 hover:scale-110" />
                    </div>
                    <div className="p-6">
                        <div className="flex items-center gap-2 mb-3">
                            <span className="text-xs font-bold text-gray-900">{news.company}</span>
                            <span className="text-xs text-gray-500">{news.ticker}</span>
                        </div>
                        <h3 className="text-lg font-bold text-gray-900 mb-3 line-clamp-2 leading-tight hover:text-amber-700 transition-colors">
                            {news.title}
                        </h3>
                        <p className="text-sm text-gray-600 mb-4 line-clamp-2 leading-relaxed">{news.summary}</p>
                        <div className="flex flex-wrap gap-1.5 mb-4">
                            {news.tags.slice(0, 3).map(tag => (
                                <span key={tag} className="px-2 py-1 bg-amber-50 text-amber-800 text-xs font-medium rounded-md border border-amber-200">
                                    #{tag}
                                </span>
                            ))}
                            {news.tags.length > 3 && (
                                <span className="px-2 py-1 bg-gray-100 text-gray-600 text-xs font-medium rounded-md">
                                    +{news.tags.length - 3}
                                </span>
                            )}
                        </div>
                        <div className="flex items-center justify-between pt-4 border-t border-amber-50">
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-1 text-gray-500">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                    <span className="text-xs">{news.views}</span>
                                </div>
                                <div className="flex items-center gap-1 text-gray-500">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
                                    </svg>
                                    <span className="text-xs">{news.comments}</span>
                                </div>
                            </div>
                            <div className="text-xs text-gray-400">{news.source} · {news.time}</div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ───── AddNewsModal ───── */
        function AddNewsModal({ onClose, onAdd, allTags }) {
            const [form, setForm] = useState({
                title: '', summary: '', fullContent: '<strong> 주요 내용 </strong>\n   ▷ 내용\n   ▷ 내용',
                company: '', ticker: '', url: '',
                source: '', priceChange: '', isPositive: true,
                image: 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=800'
            });
            const [tagInput, setTagInput] = useState('');
            const [tags, setTags] = useState([]);
            const [attachments, setAttachments] = useState([]);

            const addTag = (t) => {
                const v = t.trim().replace(/^#/, '');
                if (v && !tags.includes(v)) setTags(prev => [...prev, v]);
                setTagInput('');
            };
            const removeTag = (t) => setTags(prev => prev.filter(x => x !== t));

            const addAttachment = (file) => {
                const reader = new FileReader();
                reader.onload = ev => setAttachments(prev => [...prev, { name: file.name, data: ev.target.result, type: file.type, size: file.size }]);
                reader.readAsDataURL(file);
            };

            const handleSubmit = () => {
                if (!form.title || !form.company) return alert('제목과 종목명은 필수입니다.');
                onAdd({
                    id: Date.now(),
                    ...form,
                    tags,
                    attachments,
                    time: '방금 전',
                    views: 0,
                    comments: 0
                });
                onClose();
            };

            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl my-8 overflow-hidden">
                        {/* 헤더 */}
                        <div className="gradient-bg px-6 py-5 flex items-center justify-between">
                            <h2 className="text-white font-bold text-xl">📰 뉴스 추가</h2>
                            <button onClick={onClose} className="text-white/80 hover:text-white">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        {/* 폼 */}
                        <div className="p-6 overflow-y-auto max-h-[75vh] space-y-4">
                            {/* 제목 */}
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">제목 <span className="text-red-400">*</span></label>
                                <input className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm gold-ring outline-none"
                                    placeholder="뉴스 제목을 입력하세요" value={form.title}
                                    onChange={e => setForm({...form, title: e.target.value})} />
                            </div>
                            {/* 종목명 / 티커 */}
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">종목명 <span className="text-red-400">*</span></label>
                                    <input className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm gold-ring outline-none"
                                        placeholder="예: 삼성전자" value={form.company}
                                        onChange={e => setForm({...form, company: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">티커</label>
                                    <input className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm gold-ring outline-none"
                                        placeholder="예: 005930" value={form.ticker}
                                        onChange={e => setForm({...form, ticker: e.target.value})} />
                                </div>
                            </div>
                            {/* 요약 */}
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">요약</label>
                                <textarea className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm gold-ring outline-none resize-none"
                                    rows={2} placeholder="뉴스 요약을 입력하세요" value={form.summary}
                                    onChange={e => setForm({...form, summary: e.target.value})} />
                            </div>
                            {/* 본문 */}
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">본문</label>
                                <textarea className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm gold-ring outline-none resize-none"
                                    rows={6} placeholder="본문을 입력하세요" value={form.fullContent}
                                    onChange={e => setForm({...form, fullContent: e.target.value})} />
                            </div>
                            {/* 이미지 업로드 */}
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">이미지</label>
                                <div
                                    onDragOver={e => { e.preventDefault(); e.currentTarget.setAttribute('data-drag','true'); }}
                                    onDragLeave={e => e.currentTarget.removeAttribute('data-drag')}
                                    onDrop={e => {
                                        e.preventDefault();
                                        e.currentTarget.removeAttribute('data-drag');
                                        const file = e.dataTransfer.files[0];
                                        if (file && file.type.startsWith('image/')) {
                                            const reader = new FileReader();
                                            reader.onload = ev => setForm(f => ({...f, image: ev.target.result}));
                                            reader.readAsDataURL(file);
                                        }
                                    }}
                                    onPaste={e => {
                                        const item = Array.from(e.clipboardData.items).find(i => i.type.startsWith('image/'));
                                        if (item) {
                                            e.preventDefault();
                                            const reader = new FileReader();
                                            reader.onload = ev => setForm(f => ({...f, image: ev.target.result}));
                                            reader.readAsDataURL(item.getAsFile());
                                        }
                                    }}

        function TagManagerModal({ allTags, newsList, setNewsList, onClose }) {
            const [newTag, setNewTag] = useState('');

            const addGlobalTag = () => {
                const v = newTag.trim().replace(/^#/, '');
                if (!v || allTags.includes(v)) return;
                // 첫 뉴스에 추가 (글로벌 태그 풀에 반영)
                setNewsList(prev => prev.map((n, i) => i === 0 ? {...n, tags: [...n.tags, v]} : n));
                setNewTag('');
            };

            const deleteGlobalTag = (tag) => {
                if (!window.confirm(`태그 "#${tag}"을 모든 뉴스에서 삭제할까요?`)) return;
                setNewsList(prev => prev.map(n => ({...n, tags: n.tags.filter(t => t !== tag)})));
            };

            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md my-8">
                        <div className="gradient-bg px-6 py-5 flex items-center justify-between">

                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        <div className="p-6">
                            <p className="text-sm text-gray-500 mb-4">태그를 삭제하면 모든 뉴스에서 해당 태그가 제거됩니다.</p>

                                <input className="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm gold-ring outline-none"

                                    onChange={e => setNewTag(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && (e.preventDefault(), addGlobalTag())} />
                                <button onClick={addGlobalTag}

                                        </span>

                                {allTags.length === 0 && <p className="text-gray-400 text-sm text-center py-8">태그가 없습니다</p>}

        const GH_CONFIG_KEY = 'stockNews_ghConfig';

        function loadGhConfig() {
            try { return JSON.parse(localStorage.getItem(GH_CONFIG_KEY)) || {}; } catch(e) { return {}; }
        }
        function saveGhConfig(cfg) {
            localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
        }

        async function gistLoad(token, gistId) {
            const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
            });
            if (!res.ok) throw new Error('Gist 불러오기 실패: ' + res.status);
            const data = await res.json();
            const file = data.files['news.json'];
            if (!file) throw new Error('news.json 파일이 Gist에 없습니다.');
            return JSON.parse(file.content);
        }

        async function gistSave(token, gistId, newsList) {
            // base64 이미지는 Gist 용량 초과 원인 → URL이 아닌 경우(data:로 시작) 제거
            const stripped = newsList.map(n => ({
                ...n,
                image: (n.image && !n.image.startsWith('data:')) ? n.image : '',
                attachments: (n.attachments || []).map(a => ({...a, data: ''}))
            }));
            const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                method: 'PATCH',
                headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ files: { 'news.json': { content: JSON.stringify(stripped, null, 2) } } })
            });
            if (!res.ok) throw new Error('Gist 저장 실패: ' + res.status);
        }

        function GitHubSettingsModal({ onClose, onSaved }) {
            const cfg = loadGhConfig();
            const [token, setToken] = useState(cfg.token || '');
            const [gistId, setGistId] = useState(cfg.gistId || '');
            const [testing, setTesting] = useState(false);
            const [msg, setMsg] = useState('');

            const handleTest = async () => {
                if (!token || !gistId) return setMsg('토큰과 Gist ID를 모두 입력하세요.');
                setTesting(true); setMsg('');
                try {
                    await gistLoad(token, gistId);
                    setMsg('✅ 연결 성공!');
                } catch(e) {
                    setMsg('❌ ' + e.message);
                } finally { setTesting(false); }
            };

            const handleSave = () => {
                if (!token || !gistId) return setMsg('토큰과 Gist ID를 모두 입력하세요.');
                saveGhConfig({ token, gistId });
                onSaved({ token, gistId });
                onClose();
            };

            const handleDisconnect = () => {
                if (!window.confirm('GitHub Gist 연결을 해제할까요?\n해제 후에는 로컬 저장만 사용합니다.')) return;
                localStorage.removeItem(GH_CONFIG_KEY);
                onSaved({});
                onClose();
            };

            return (
                <div className="modal-overlay" style={{zIndex:80}} onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg my-8 overflow-hidden">
                        <div className="gradient-bg px-6 py-5 flex items-center justify-between">
                            <h2 className="text-white font-bold text-xl">⚙️ GitHub Gist 연동</h2>
                            <button onClick={onClose} className="text-white/80 hover:text-white">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        <div className="p-6 space-y-5">
                            <div className="p-4 bg-amber-50 rounded-xl border border-amber-100 text-sm text-amber-800 space-y-1.5">
                                <p className="font-semibold">📋 설정 방법</p>
                                <p>1. <a href="https://github.com/settings/tokens/new?scopes=gist" target="_blank" className="underline text-amber-700">github.com → Settings → Tokens</a> 에서 <strong>gist</strong> 권한으로 토큰 생성</p>
                                <p>2. <a href="https://gist.github.com" target="_blank" className="underline text-amber-700">gist.github.com</a> 에서 새 Gist 생성 → 파일명 <strong>news.json</strong>, 내용 <strong>[]</strong></p>
                                <p>3. Gist URL에서 ID 복사 (마지막 긴 문자열)</p>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">Personal Access Token</label>
                                <input type="password" className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm gold-ring outline-none"
                                    placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
                                    value={token} onChange={e => setToken(e.target.value)} />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">Gist ID</label>
                                <input className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm gold-ring outline-none"
                                    placeholder="예: abc123def456..."
                                    value={gistId} onChange={e => setGistId(e.target.value)} />
                            </div>
                            {msg && <p className={`text-sm font-medium ${msg.startsWith('✅') ? 'text-green-600' : 'text-red-500'}`}>{msg}</p>}
                        </div>
                        <div className="px-6 py-4 border-t border-gray-100 flex gap-3">
                            {cfg.token && <button onClick={handleDisconnect} className="px-4 py-2.5 border border-red-200 text-red-500 rounded-xl text-sm font-semibold hover:bg-red-50 transition-all">연결 해제</button>}
                            <div className="flex-1" />
                            <button onClick={handleTest} disabled={testing}
                                className="px-5 py-2.5 border border-gray-200 rounded-xl text-gray-600 font-semibold hover:bg-gray-50 transition-all text-sm disabled:opacity-50">
                                {testing ? '테스트 중...' : '연결 테스트'}
                            </button>
                            <button onClick={handleSave} className="px-6 py-2.5 gradient-bg text-white rounded-xl font-semibold hover:shadow-lg transition-all text-sm">저장</button>
                        </div>
                    </div>
                </div>
            );

                                        </div>
                                    </div>

                                    {/* 본문 */}
                                    <div className="p-8 max-h-[65vh] overflow-y-auto">

                                        {/* ── 태그 + 편집 버튼 (1줄) ── */}
                                        <div className="flex items-center gap-1.5 mb-5 overflow-x-auto pb-1" style={{scrollbarWidth:'none'}}>
                                            {selectedNews.tags.map(tag => (
                                                <button key={tag}
                                                    onClick={() => { setSelectedNews(null); setSelectedTags([tag]); }}
                                                    className="tag-chip tag-chip-inactive text-xs whitespace-nowrap flex-shrink-0">#{tag}</button>
                                            ))}
                                            <button onClick={() => { setShowTagEdit(v => !v); setTagInputDetail(''); }}
                                                className="flex-shrink-0 ml-auto flex items-center gap-1 px-2.5 py-1 rounded-lg border border-amber-200 text-amber-700 text-xs font-semibold hover:bg-amber-50 transition-all whitespace-nowrap">
                                                <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                                                </svg>
                                                태그 편집
                                            </button>
                                            <button onClick={() => setShowEditNews(true)}
                                                className="flex-shrink-0 flex items-center gap-1 px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600 text-xs font-semibold hover:bg-gray-50 transition-all whitespace-nowrap">
                                                <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                                </svg>
                                                수정
                                            </button>
                                        </div>

                                        {/* 태그 편집 패널 */}
                                        {showTagEdit && (
                                            <div className="mb-5 p-4 bg-amber-50 rounded-xl border border-amber-100">
                                                <div className="flex flex-wrap gap-2 mb-3">
                                                    {selectedNews.tags.map(tag => (
                                                        <span key={tag} className="tag-chip tag-chip-active">
                                                            #{tag}
                                                            <span className="tag-del-btn" onClick={() => removeTagFromNews(selectedNews.id, tag)}>×</span>
                                                        </span>
                                                    ))}
                                                    {selectedNews.tags.length === 0 && <span className="text-amber-400 text-sm">태그 없음</span>}
                                                </div>
                                                <div className="flex gap-2">
                                                    <input className="flex-1 border border-amber-200 rounded-lg px-3 py-1.5 text-sm gold-ring outline-none bg-white"
                                                        placeholder="새 태그 입력 후 Enter..." value={tagInputDetail}
                                                        onChange={e => setTagInputDetail(e.target.value)}
                                                        onKeyDown={e => e.key === 'Enter' && (e.preventDefault(), addTagToNews(selectedNews.id, tagInputDetail))} />
                                                    <button onClick={() => addTagToNews(selectedNews.id, tagInputDetail)}
                                                        className="px-3 py-1.5 gradient-bg text-white rounded-lg text-sm font-semibold transition-all">추가</button>
                                                </div>
                                            </div>
                                        )}

                                        {/* 본문 텍스트 */}
                                        <div className="prose prose-lg max-w-none text-gray-700 leading-relaxed"
                                            dangerouslySetInnerHTML={{ __html: (selectedNews.fullContent || selectedNews.summary).replace(/\n/g, '<br/>') }} />

                                        {/* 웹 주소 */}
                                        {selectedNews.url && (
                                            <div className="mt-6 pt-5 border-t border-gray-100">
                                                <a href={selectedNews.url} target="_blank" rel="noopener noreferrer"
                                                    className="inline-flex items-center gap-2 px-4 py-2.5 gradient-bg text-white rounded-xl text-sm font-semibold hover:shadow-md transition-all">
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                                    </svg>
                                                    원문 바로가기
                                                </a>
                                            </div>
                                        )}

                                        {/* 첨부파일 */}
                                        {selectedNews.attachments && selectedNews.attachments.length > 0 && (
                                            <div className="mt-5 pt-5 border-t border-gray-100">
                                                <p className="text-sm font-semibold text-gray-700 mb-2">📎 첨부파일</p>
                                                <div className="space-y-1.5">
                                                    {selectedNews.attachments.map((f, i) => (
                                                        <a key={i} href={f.data} download={f.name}
                                                            className="flex items-center justify-between px-3 py-2.5 bg-gray-50 rounded-lg hover:bg-amber-50 transition-all group">
                                                            <span className="text-sm text-gray-700 group-hover:text-amber-800 truncate flex-1">📎 {f.name}</span>
                                                            <span className="text-xs text-gray-400 ml-2 flex-shrink-0">{(f.size/1024).toFixed(0)}KB</span>
                                                            <svg className="w-4 h-4 text-gray-400 group-hover:text-amber-600 ml-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                                            </svg>
                                                        </a>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 푸터 */}
                    <footer className="border-t border-amber-100 mt-12 bg-white">
                        <div className="max-w-7xl mx-auto px-6 py-6 text-center text-amber-700/60 text-sm">
                            © 2025 Stock News App · 실시간 주식 뉴스 모니터링 서비스
                        </div>
                    </footer>

                    {/* 모달들 */}
                    {showAddNews && <AddNewsModal onClose={() => setShowAddNews(false)} onAdd={addNews} allTags={allTags} />}
                    {showTagManager && <TagManagerModal allTags={allTags} newsList={newsList} setNewsList={setNewsList} onClose={() => setShowTagManager(false)} />}
                    {showEditNews && selectedNews && <EditNewsModal news={selectedNews} onClose={() => setShowEditNews(false)} onSave={saveNews} allTags={allTags} />}
                    {showGhSettings && <GitHubSettingsModal onClose={() => setShowGhSettings(false)} onSaved={(cfg) => setGhConfig(cfg)} />}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
